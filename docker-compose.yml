services:
  postgres:
    image: postgres:16-alpine
    container_name: pincode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pincode_user
      POSTGRES_PASSWORD: pincode_password
      POSTGRES_DB: pincode_db
    ports:
      - "5433:5432"
    volumes:
      - pincode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pincode_user -d pincode_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pincode-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pincode_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pincode_pgdata:
  pincode_redisdata:
